name: Trigger COPR build

on:
  schedule:
    - cron: "0 3 * * *"

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Install copr-cli
        run: |
          python3 -m pip install copr-cli

      - name: Configure COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          mkdir -p ~/.config/copr
          cat > ~/.config/copr/config <<EOF
          [copr-cli]
          login = $COPR_LOGIN
          token = $COPR_TOKEN
          EOF

      - name: Trigger COPR build
        run: |
          copr-cli build-package boydkelly/ghostty-tip --name ghostty
